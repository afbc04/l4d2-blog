services:
  mongo:
    image: mongo:7
    container_name: l4d2-database
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-data:/data/db
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    logging:
      driver: "none"

  api:
    build: .
    container_name: l4d2-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8989:8989"
    depends_on:
      - mongo
    command: npm start

volumes:
  mongo-data: